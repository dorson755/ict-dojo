AWSTemplateFormatVersion: '2010-09-09'
Description: Private, versioned BJC and BGCSE intake storage. Deploy only after owner approval.
Parameters:
  AllowedOrigin:
    Type: String
    Description: Exact HTTPS site origin, without a trailing slash.
    AllowedPattern: '^https://[a-zA-Z0-9.-]+$'
  RuntimeUserName:
    Type: String
    Default: ict-dojo-runtime
    Description: Existing application runtime IAM user. No new credentials are created.
Resources:
  ExamPapers:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      VersioningConfiguration:
        Status: Enabled
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      CorsConfiguration:
        CorsRules:
          - AllowedOrigins:
              - !Ref AllowedOrigin
            AllowedMethods: [POST]
            AllowedHeaders: ['*']
            MaxAge: 300
  ExamPapersPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref ExamPapers
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: RequireTLS
            Effect: Deny
            Principal: '*'
            Action: 's3:*'
            Resource:
              - !GetAtt ExamPapers.Arn
              - !Sub '${ExamPapers.Arn}/*'
            Condition:
              Bool:
                aws:SecureTransport: false
  RuntimePaperPolicy:
    Type: AWS::IAM::Policy
    Properties:
      PolicyName: !Sub '${AWS::StackName}-runtime'
      Users:
        - !Ref RuntimeUserName
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: PrivatePaperObjects
            Effect: Allow
            Action:
              - s3:PutObject
              - s3:GetObject
              - s3:GetObjectVersion
            Resource:
              - !Sub '${ExamPapers.Arn}/intake/bgcse/*'
              - !Sub '${ExamPapers.Arn}/intake/bjc/*'
Outputs:
  BucketName:
    Value: !Ref ExamPapers
  RuntimeObjectResource:
    Value: !Sub '${ExamPapers.Arn}/intake/bgcse/*'
  BjcRuntimeObjectResource:
    Value: !Sub '${ExamPapers.Arn}/intake/bjc/*'
